<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AutoRemate</title>

  <script>
    (function () {
      var path = window.location.pathname;
      var match = path.match(/^\/deal\/([^\/]+)\/?$/i);

      if (match) {
        var deal = decodeURIComponent(match[1]);

        window.location.replace(
          "/?deal=" + encodeURIComponent(deal)
        );
        return;
      }

      window.location.replace("/");
    })();
  </script>
</head>
<body>
</body>
</html>
