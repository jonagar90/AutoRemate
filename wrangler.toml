name = "autoremate-api"
main = "worker.js"
compatibility_date = "2026-08-01"

# Create the KV namespace first: wrangler kv namespace create CARS_KV
# Then paste its id below.
kv_namespaces = [
  { binding = "CARS_KV", id = "7c2f4bde995f49d882974c1b87383c0a" }
]

# Create the R2 bucket first: wrangler r2 bucket create autoremate-images
r2_buckets = [
  { binding = "IMAGES", bucket_name = "autoremate-images" }
]

[vars]
ALLOWED_ORIGIN = "https://jonagar90.github.io"

# Set the admin password as a secret (not in this file):
# wrangler secret put ADMIN_PASSWORD
